name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # npm test runs tsc --noEmit, next build, then node --test against the built output.
      - name: Typecheck, build and test
        run: npm test
        env:
          # CI never calls a paid model; the API runs in demo mode.
          OPENAI_API_KEY: ""
          NEXT_TELEMETRY_DISABLED: "1"
